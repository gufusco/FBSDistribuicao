[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fbs-assistente"
version = "0.1.0"
description = "Assistente operacional da FBS Distribuicao"
requires-python = ">=3.13"
dependencies = [
  "pandas>=2.2,<3",
  "scikit-learn>=1.5,<2",
  "Unidecode>=1.3,<2",
  "python-telegram-bot>=21,<22",
  "python-dotenv>=1.0,<2",
  "joblib>=1.4,<2",
  "rapidfuzz>=3.9,<4",
]

[project.optional-dependencies]
dev = [
  "matplotlib>=3.9,<4",
  "pytest>=8.2,<9",
  "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["src"]
